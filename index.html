<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>超級瑪利歐兄弟 - NES 單檔網頁版</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0b0f;color:#e8ecf5;
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:0 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:6px}
#cv{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;
  border-radius:6px;box-shadow:0 0 0 1px #23232f,0 10px 34px rgba(0,0,0,.65)}
#toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,10px);opacity:0;
  transition:.22s;background:rgba(0,0,0,.78);border:1px solid #33334a;color:#fff;
  padding:6px 16px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- 控制區 ---- */
#pad{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));transition:opacity .3s}
#pad.dim{opacity:.45}
#dpad{position:relative;flex:0 0 auto;width:clamp(112px,33vw,152px);aspect-ratio:1/1;
  border-radius:20px;touch-action:none;
  background:radial-gradient(circle at 50% 45%,#1c1c28,#0e0e15 72%);
  border:1px solid #2b2b3a;box-shadow:inset 0 0 22px rgba(0,0,0,.8)}
#dpad span{position:absolute;font-size:15px;color:#6c7488;transition:.08s;pointer-events:none}
#dpad span.on{color:#ffd166;text-shadow:0 0 14px rgba(255,209,102,.75);transform-origin:center}
.d-up{top:7px;left:50%;transform:translateX(-50%)}
.d-down{bottom:7px;left:50%;transform:translateX(-50%)}
.d-left{left:7px;top:50%;transform:translateY(-50%)}
.d-right{right:7px;top:50%;transform:translateY(-50%)}
.d-center{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,#26263a,#15151f);border:1px solid #31314a}
#tools{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));
  display:flex;gap:6px;z-index:5}
#tools button{width:30px;height:30px;border-radius:9px;font-size:13px;line-height:1;
  background:rgba(18,18,26,.72);border:1px solid #2a2a38;color:#9aa3b8;backdrop-filter:blur(4px)}
#tools button.off{color:#5b6274}
#mid{display:flex;flex-direction:column;gap:8px;align-items:center;flex:0 0 auto}
#mid .row{display:flex;gap:8px;justify-content:center}
.pill{padding:9px 14px;border-radius:999px;background:#1d1d2a;border:1px solid #33334a;
  color:#cfd3e0;font-size:12px;letter-spacing:.6px;font-weight:600;touch-action:none}
.tools button{width:36px;height:36px;border-radius:11px;background:#15151f;border:1px solid #2a2a38;
  color:#9aa3b8;font-size:15px;line-height:1;touch-action:none}
.tools button.off{color:#5b6274}
#ab{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.rnd{width:clamp(60px,17.5vw,80px);aspect-ratio:1;border-radius:50%;color:#fff;font-weight:800;
  font-size:19px;letter-spacing:1px;touch-action:none;
  border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.rnd.a{background:linear-gradient(#ef5a5a,#a81c1c)}
.rnd.b{background:linear-gradient(#5590ee,#1f4a9e)}
button.on{transform:scale(.94);filter:brightness(1.3)}
button{font-family:inherit;cursor:pointer}

/* ---- 開場遮罩 ---- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:24px;background:radial-gradient(circle at 50% 28%,#1b1b2f,#07070c 72%)}
#overlay.hide{display:none}
.card{text-align:center;max-width:430px}
.card h1{margin:0 0 8px;font-size:clamp(25px,7.4vw,40px);letter-spacing:3px;
  text-shadow:0 3px 0 #7d1414,0 0 26px rgba(255,90,90,.35)}
.card .sub{margin:0 0 28px;color:#8b93a7;font-size:13px;letter-spacing:1.5px}
#btnStart{font-size:20px;font-weight:700;padding:15px 46px;border-radius:999px;border:0;color:#fff;
  background:linear-gradient(#ff5f5f,#c11f1f);box-shadow:0 8px 24px rgba(193,31,31,.45)}
.card .tip{margin-top:26px;color:#7f879b;font-size:13px;line-height:2}
.card .tip b{color:#c9d1e4}

@media (orientation:portrait){
  #mid .row{flex-direction:column;gap:7px}
  .pill{padding:9px 10px;font-size:11px;min-width:78px;text-align:center}
  #dpad{width:clamp(108px,30vw,138px)}
  #ab{gap:8px}
}
@media (orientation:landscape){
  #app{display:block;justify-content:flex-start}
  #stage{position:absolute;inset:0;padding:0}
  #cv{max-height:100dvh;border-radius:0;box-shadow:none}
  #pad{position:fixed;inset:0;padding:0;pointer-events:none;opacity:1}
  #dpad,#ab,#mid{pointer-events:auto;position:absolute;opacity:.8}
  #dpad{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
    width:clamp(92px,26vh,140px)}
  #ab{right:calc(16px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom))}
  #tools{top:calc(6px + env(safe-area-inset-top));right:auto;left:50%;transform:translateX(-50%);opacity:.85}
  #mid{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
    flex-direction:row;align-items:center;gap:10px;flex:0 0 auto}
  #mid .tools button{width:32px;height:32px;font-size:13px}
  .pill{padding:8px 11px;font-size:11px}
  .rnd{width:clamp(54px,15vh,72px);font-size:17px}
  #toast{bottom:auto;top:10px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="256" height="240"></canvas>
    <div id="tools">
      <button id="btnSave" title="存檔">💾</button>
      <button id="btnLoad" title="讀檔">📂</button>
      <button id="btnMute" title="音效">🔊</button>
      <button id="btnFull" title="全螢幕">⛶</button>
    </div>
    <div id="toast"></div>
  </div>

  <div id="pad" class="dim">
    <div id="dpad">
      <span class="d-up">▲</span><span class="d-down">▼</span>
      <span class="d-left">◀</span><span class="d-right">▶</span>
      <i class="d-center"></i>
    </div>
    <div id="mid">
      <div class="row">
        <button class="pill" data-btn="3">START</button>
        <button class="pill" data-btn="2">SELECT</button>
      </div>
    </div>
    <div id="ab">
      <button class="rnd b" data-btn="1">B</button>
      <button class="rnd a" data-btn="0">A</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h1>超級瑪利歐兄弟</h1>
    <p class="sub">NES · smb1.nes</p>
    <button id="btnStart">開始遊戲</button>
    <p class="tip">
      <b>A</b>＝跳躍　<b>B</b>＝加速跑／火球<br>
      <b>方向鍵</b>移動　<b>START</b> 暫停　<b>SELECT</b> 選單<br>
      💾 隨時存檔 · 📂 讀檔 · ⛶ 橫向全螢幕
    </p>
  </div>
</div>

  constructor() {
    super();

    this.capacity = 8192;
    this.bufferL = new Float32Array(this.capacity);
    this.bufferR = new Float32Array(this.capacity);
    this.readPos = 0;
    this.writePos = 0;
    this.count = 0;

    this.port.onmessage = (e) => {
      if (e.data.type === "samples") {
        const left = e.data.left;
        const right = e.data.right;
        const len = left.length;

        // If adding these samples would overflow, drop oldest to make room
        if (this.count + len > this.capacity) {
          const drop = this.count + len - this.capacity;
          this.readPos = (this.readPos + drop) % this.capacity;
          this.count -= drop;
        }

        for (let i = 0; i < len; i++) {
          this.bufferL[this.writePos] = left[i];
          this.bufferR[this.writePos] = right[i];
          this.writePos = (this.writePos + 1) % this.capacity;
        }
        this.count += len;
      }
    };
  }

  process(inputs, outputs) {
    const output = outputs[0];
    if (!output || output.length < 2) return true;

    const outL = output[0];
    const outR = output[1];
    const size = outL.length;

    if (this.count < size) {
      for (let i = 0; i < this.count; i++) {
        outL[i] = this.bufferL[this.readPos];
        outR[i] = this.bufferR[this.readPos];
        this.readPos = (this.readPos + 1) % this.capacity;
      }

        outL[i] = 0;
        outR[i] = 0;
      }

      this.port.postMessage({ type: "underrun" });
    } else {
      for (let i = 0; i < size; i++) {
        outL[i] = this.bufferL[this.readPos];
        outR[i] = this.bufferR[this.readPos];
        this.readPos = (this.readPos + 1) % this.capacity;
      }
      this.count -= size;
    }

    return true;
  }

  // ---- 音訊 ----
  var actx = null, sr = 44100, gain = null, proc = null;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  } catch (e) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e2) { actx = null; }
  }
  if (actx) sr = actx.sampleRate || 44100;

  var RB = Math.max(8192, Math.floor(sr * 0.5));
  var bufL = new Float32Array(RB), bufR = new Float32Array(RB);
  var wp = 0, rp = 0, filled = 0;
  var muted = false;
  var audioN = 0, audioPeak = 0, underruns = 0;
  var LATENCY = 2400;               // 預留約 50ms 緩衝，避免抖動造成斷音

  function onAudioSample(l, r) {
    audioN++;
    var al = l < 0 ? -l : l, ar = r < 0 ? -r : r;
    if (al > audioPeak) audioPeak = al;
    if (ar > audioPeak) audioPeak = ar;
    if (muted) return;
    if (filled >= RB) return;       // 滿了就丟，防止延遲累積
    bufL[wp] = l; bufR[wp] = r;
    wp = (wp + 1) % RB;
    filled++;
  }

  function initAudio() {
    if (!actx || proc) return;
    for (var i = 0; i < LATENCY; i++) { bufL[wp] = 0; bufR[wp] = 0; wp = (wp + 1) % RB; filled++; }
    proc = actx.createScriptProcessor(2048, 0, 2);
    gain = actx.createGain();
    gain.gain.value = 0.34;
    proc.onaudioprocess = function (e) {
      var l = e.outputBuffer.getChannelData(0), r = e.outputBuffer.getChannelData(1);
      for (var i = 0; i < l.length; i++) {
        if (filled > 0) { l[i] = bufL[rp]; r[i] = bufR[rp]; rp = (rp + 1) % RB; filled--; }
        else { l[i] = 0; r[i] = 0; underruns++; }
      }
    };
    proc.connect(gain);
    gain.connect(actx.destination);
  }

  // ---- 模擬器 ----
  var frameCount = 0;
  var nes = new jsnes.NES({
    sampleRate: sr,
    onFrame: function (buf) {
      frameCount++;
      for (var i = 0; i < 61440; i++) {
        var c = buf[i];
        px[i] = 0xff000000 | ((c & 0xff) << 16) | (c & 0xff00) | ((c >>> 16) & 0xff);
      }
      g.putImageData(imgData, 0, 0);
    },
    onAudioSample: onAudioSample
  });

  // 標準 2C02 調色盤。jsnes 內建的 NTSC 色表色相排列不同，
  // 會讓 SMB 的天空變粉紅、瑪利歐變藍色，這裡換成官方色序。
  var CANON = [
    0x7c7c7c, 0x0000fc, 0x0000bc, 0x4428bc, 0x940084, 0xa80020, 0xa81000, 0x881400,
    0x503000, 0x007800, 0x006800, 0x005800, 0x004058, 0x000000, 0x000000, 0x000000,
    0xbcbcbc, 0x0078f8, 0x0058f8, 0x6844fc, 0xd800cc, 0xe40058, 0xf83800, 0xe45c10,
    0xac7c00, 0x00b800, 0x00a800, 0x00a844, 0x008888, 0x000000, 0x000000, 0x000000,
    0xf8f8f8, 0x3cbcfc, 0x6888fc, 0x9878f8, 0xf878f8, 0xf85898, 0xf87858, 0xfca044,
    0xf8b800, 0xb8f818, 0x58d854, 0x58f898, 0x00e8d8, 0x787878, 0x000000, 0x000000,
    0xfcfcfc, 0xa4e4fc, 0xb8b8f8, 0xd8b8f8, 0xf8b8f8, 0xf8a4c0, 0xf0d0b0, 0xfce0a8,
    0xf8d878, 0xd8f878, 0xb8f8b8, 0xb8f8d8, 0x00fcfc, 0xf8d8f8, 0x000000, 0x000000
  ];

  function applyPalette() {
    var pt = nes.ppu && nes.ppu.palTable;
    if (!pt || !pt.makeTables) return;
    pt.curTable = new Uint32Array(CANON);
    pt.currentEmph = -1;
    pt.makeTables();
    pt.setEmphasis(0);
  }

  function loadROM() {
    var bin = atob(ROM_B64);
    nes.loadROM(bin);
    applyPalette();
  }

  // ---- 輸入 ----
  var B = jsnes.Controller;
  var KEYMAP = {
    ArrowUp: B.BUTTON_UP, ArrowDown: B.BUTTON_DOWN, ArrowLeft: B.BUTTON_LEFT, ArrowRight: B.BUTTON_RIGHT,
    KeyW: B.BUTTON_UP, KeyS: B.BUTTON_DOWN, KeyA: B.BUTTON_LEFT, KeyD: B.BUTTON_RIGHT,
    KeyX: B.BUTTON_A, KeyK: B.BUTTON_A, Space: B.BUTTON_A,
    KeyZ: B.BUTTON_B, KeyJ: B.BUTTON_B,
    Enter: B.BUTTON_START, Escape: B.BUTTON_START,
    ShiftLeft: B.BUTTON_SELECT, KeyC: B.BUTTON_SELECT
  };
  var held = {};
  function press(btn) { if (!held[btn]) { held[btn] = 1; nes.buttonDown(1, btn); } }
  function release(btn) { if (held[btn]) { held[btn] = 0; nes.buttonUp(1, btn); } }
  function releaseAll() { for (var k in held) if (held[k]) release(+k); }

  window.addEventListener("keydown", function (e) {
    var b = KEYMAP[e.code];
    if (b === undefined) return;
    e.preventDefault();
    press(b);
  }, { passive: false });
  window.addEventListener("keyup", function (e) {
    var b = KEYMAP[e.code];
    if (b === undefined) return;
    e.preventDefault();
    release(b);
  }, { passive: false });
  window.addEventListener("blur", releaseAll);

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

  // 按鈕（A / B / START / SELECT）
  Array.prototype.forEach.call(document.querySelectorAll("[data-btn]"), function (el) {
    var btn = +el.getAttribute("data-btn");
    function down(e) {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      el.classList.add("on");
      press(btn); buzz(8);
    }
    function up(e) {
      if (e) e.preventDefault();
      el.classList.remove("on");
      release(btn);
    }
    el.addEventListener("pointerdown", down, { passive: false });
    el.addEventListener("pointerup", up, { passive: false });
    el.addEventListener("pointercancel", up, { passive: false });
    el.addEventListener("lostpointercapture", function () { el.classList.remove("on"); release(btn); });
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });

  // 十字鍵：以手指相對中心的位移判斷方向，支援斜向與多指
  var dpad = document.getElementById("dpad");
  var dirEls = {
    4: dpad.querySelector(".d-up"), 5: dpad.querySelector(".d-down"),
    6: dpad.querySelector(".d-left"), 7: dpad.querySelector(".d-right")
  };
  var pointers = new Map();

  function applyDirs() {
    var want = { 4: 0, 5: 0, 6: 0, 7: 0 };
    pointers.forEach(function (v) { for (var k in v) if (v[k]) want[+k] = 1; });
    for (var k in want) {
      var b = +k;
      if (want[k]) { press(b); if (dirEls[b]) dirEls[b].classList.add("on"); }
      else { release(b); if (dirEls[b]) dirEls[b].classList.remove("on"); }
    }
  }

  function readPad(e) {
    var r = dpad.getBoundingClientRect();
    var nx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
    var ny = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
    var dead = 0.26;
    return { 4: ny < -dead, 5: ny > dead, 6: nx < -dead, 7: nx > dead };
  }

  dpad.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    try { dpad.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, readPad(e));
    applyDirs(); buzz(8);
  }, { passive: false });
  dpad.addEventListener("pointermove", function (e) {
    if (!pointers.has(e.pointerId)) return;
    e.preventDefault();
    pointers.set(e.pointerId, readPad(e));
    applyDirs();
  }, { passive: false });
  function padEnd(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    applyDirs();
  }
  dpad.addEventListener("pointerup", padEnd);
  dpad.addEventListener("pointercancel", padEnd);
  dpad.addEventListener("lostpointercapture", padEnd);
  dpad.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // ---- 主迴圈 ----
  var FPS = 60.0988, acc = 0, last = 0, running = false, rafId = 0;

  // ---- 畫面尺寸：依可用空間等比放大，盡量整數倍以保持像素銳利 ----
  function fit() {
    var stage = document.getElementById("stage");
    var pad = document.getElementById("pad");
    var land = window.matchMedia("(orientation: landscape)").matches;
    var availW, availH;
    if (land) {
      availW = window.innerWidth;
      availH = window.innerHeight;
    } else {
      availW = window.innerWidth - 12;
      availH = window.innerHeight - pad.offsetHeight - 18;
    }
    var s = Math.min(availW / 256, availH / 240);
    if (s > 1) {
      var q = Math.floor(s * 4) / 4;      // 1/4 級距，兼顧填滿與銳利
      if (q >= s * 0.86) s = q;
    }
    CV.style.width = Math.max(64, Math.round(256 * s)) + "px";
    CV.style.height = Math.max(60, Math.round(240 * s)) + "px";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
  fit();

  function loop(t) {
    rafId = requestAnimationFrame(loop);
    if (!running) { last = t; return; }
    if (!last) last = t;
    var dt = t - last; last = t;
    if (dt > 250) dt = 250;
    acc += dt;
    var step = 1000 / FPS, n = 0;
    while (acc >= step && n < 4) { nes.frame(); acc -= step; n++; }
    if (n === 0 && acc > step * 4) acc = 0;
  }

  // ---- 存檔 / 讀檔 ----
  var SKEY = "smb1_state_v1";
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }

  function b64enc(u8) {
    var s = "", CH = 0x8000;
    for (var i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  }
  function b64dec(str) {
    var bin = atob(str), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  function saveState() {
    try {
      var json = JSON.stringify(nes.toJSON());
      if (window.CompressionStream) {
        new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw")))
          .arrayBuffer().then(function (ab) {
            try { localStorage.setItem(SKEY, "z:" + b64enc(new Uint8Array(ab))); toast("已存檔"); }
            catch (e) { localStorage.setItem(SKEY, "j:" + json); toast("已存檔"); }
          }).catch(function () { localStorage.setItem(SKEY, "j:" + json); toast("已存檔"); });
      } else {
        localStorage.setItem(SKEY, "j:" + json);
        toast("已存檔");
      }
    } catch (e) { toast("存檔失敗"); }
  }

  function loadState() {
    var v = null;
    try { v = localStorage.getItem(SKEY); } catch (e) {}
    if (!v) { toast("沒有存檔"); return; }
    try {
      if (v.slice(0, 2) === "z:") {
        var u8 = b64dec(v.slice(2));
        new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw")))
          .text().then(function (json) { nes.fromJSON(JSON.parse(json)); toast("已讀檔"); })
          .catch(function () { toast("讀檔失敗"); });
      } else {
        nes.fromJSON(JSON.parse(v.slice(2)));
        toast("已讀檔");
      }
    } catch (e) { toast("讀檔失敗"); }
  }

  document.getElementById("btnSave").addEventListener("click", saveState);
  document.getElementById("btnLoad").addEventListener("click", loadState);

  document.getElementById("btnMute").addEventListener("click", function (e) {
    muted = !muted;
    e.currentTarget.classList.toggle("off", muted);
    e.currentTarget.textContent = muted ? "🔇" : "🔊";
    toast(muted ? "靜音" : "音效開");
  });

  function toggleFullscreen() {
    var d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      var el = d.documentElement;
      var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
      if (p && p.then) p.then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
      }).catch(function () {});
    } else {
      if (d.exitFullscreen) d.exitFullscreen();
      else if (d.webkitExitFullscreen) d.webkitExitFullscreen();
    }
  }
  document.getElementById("btnFull").addEventListener("click", toggleFullscreen);

  // ---- 啟動 ----
  function start() {
    if (running) return;
    if (actx) { initAudio(); if (actx.state === "suspended") actx.resume(); }
    document.getElementById("overlay").classList.add("hide");
    document.getElementById("pad").classList.remove("dim");
    running = true;
    last = 0; acc = 0;
  }
  document.getElementById("btnStart").addEventListener("click", start);

  // 保險：任何觸碰/按鍵都嘗試解鎖音訊（部分手機瀏覽器要這樣才出聲）
  function unlock() {
    if (actx && actx.state === "suspended") actx.resume().catch(function () {});
  }
  ["pointerdown", "touchstart", "keydown", "click"].forEach(function (ev) {
    document.addEventListener(ev, unlock, { passive: true });
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { releaseAll(); pointers.clear(); applyDirs(); running = false; }
    else if (!document.getElementById("overlay").classList.contains("hide")) { /* 仍在標題畫面 */ }
    else { running = true; last = 0; }
  });
  window.addEventListener("pagehide", function () { try { saveState(); } catch (e) {} });

  // 初始化：先跑幾幀，讓標題畫面出現在遮罩後面
  loadROM();
  for (var i = 0; i < 4; i++) nes.frame();
  rafId = requestAnimationFrame(loop);

  // 除錯／自動化測試用（不影響正常遊玩）
  window.__nes = nes;
  window.__step = function (n) { n = n || 1; for (var i = 0; i < n; i++) nes.frame(); };
  window.__resumeAudio = function () { return actx && actx.resume ? actx.resume() : null; };
  window.__state = function () {
    return { running: running, muted: muted, sr: sr, actx: actx ? actx.state : null,
             frames: frameCount, audioSamples: audioN, audioPeak: +audioPeak.toFixed(3),
             gain: gain ? gain.gain.value : null, underruns: underruns, buffer: filled };
  };
})();
</script>
</body>
</html>
